[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "peskobar-perplexity-ai"
version = "0.3.0.dev1"
description = "Unofficial Perplexity web client with session management, account tooling and MCP bridge"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Peskobar" }]
keywords = ["perplexity", "ai", "mcp", "search", "session", "automation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

dependencies = [
  "curl-cffi>=0.5.7",
  "websocket-client>=1.9.0; python_version >= '3.9'",
]

[project.optional-dependencies]
driver = ["patchright>=1.0.0", "playwright>=1.40.0"]
mcp = ["mcp>=1.0.0"]ndev = [
  "pytest>=7.4",
  "pytest-asyncio>=0.21",
  "ruff>=0.5",
]
all = ["peskobar-perplexity-ai[driver,mcp,dev]"]

[project.scripts]
perplexity-mcp = "perplexity.mcp:main"

[project.urls]
Repository = "https://github.com/Peskobar/perplexity-ai"
Issues = "https://github.com/Peskobar/perplexity-ai/issues"

[tool.setuptools.packages.find]
include = ["perplexity*", "perplexity_async*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["B006"]
