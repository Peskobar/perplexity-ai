name: Python application

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Sprawdzenie kodu
        uses: actions/checkout@v4

      - name: Konfiguracja Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Instalacja zależności
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[mcp]" flake8 pytest

      - name: Blokująca kontrola składni
        run: python -m compileall -q perplexity perplexity_async packages apps/backend tests

      - name: Raport jakości flake8
        run: |
          # Repo zawiera starszy kod i warstwę koncepcyjną. Flake8 raportuje
          # problemy jakościowe, ale nie zastępuje testów ani kompilacji składni.
          flake8 perplexity perplexity_async packages apps/backend tests \
            --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Testy pytest
        run: pytest -q
