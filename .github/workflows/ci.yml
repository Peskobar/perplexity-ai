name: CI/CD Perplexity Optymalizacja

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Sprawdzenie kodu
        uses: actions/checkout@v4

      - name: Instalacja pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.6
          run_install: false

      - name: Konfiguracja Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalacja zależności JavaScript
        run: pnpm install --no-frozen-lockfile

      - name: Zbuduj projekt frontendowy
        id: frontend_build
        continue-on-error: true
        run: |
          set -o pipefail
          pnpm build 2>&1 | tee frontend-build.log

      - name: Zapisz pełny log budowania
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build-log
          path: frontend-build.log
          if-no-files-found: error
          retention-days: 7

      - name: Zatrzymaj workflow po błędzie budowania
        if: steps.frontend_build.outcome == 'failure'
        run: exit 1

  build-docker-images:
    # Ciężkie zależności backendu, w tym llama-cpp-python, są budowane dopiero
    # w docelowym obrazie. PR-y nie kompilują lokalnego silnika modeli.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: build-and-test
    permissions:
      contents: read
      packages: write
    steps:
      - name: Sprawdzenie kodu
        uses: actions/checkout@v4

      - name: Logowanie do DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Metadane obrazów
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Zbuduj i wypchnij obraz backendu
        uses: docker/build-push-action@v6
        with:
          context: ./apps/backend
          file: ./apps/backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: build-docker-images
    environment:
      name: Produkcja
    steps:
      - name: Sprawdzenie kodu
        uses: actions/checkout@v4

      - name: Skopiuj pliki na serwer
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "infra/*,apps/backend/Dockerfile,apps/backend/requirements.txt,apps/backend/app,packages,README.md"
          target: "~/perplexity-optymalizacja"

      - name: Uruchom wdrożenie
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd ~/perplexity-optymalizacja
            export DATABASE_URL='${{ secrets.PROD_DATABASE_URL }}'
            export REDIS_URL='${{ secrets.PROD_REDIS_URL }}'
            export JWT_SECRET_KEY='${{ secrets.PROD_JWT_SECRET_KEY }}'
            export PERPLEXITY_COOKIE='${{ secrets.PROD_PERPLEXITY_COOKIE }}'
            export LOG_LEVEL='${{ secrets.PROD_LOG_LEVEL }}'
            docker compose up -d --build backend nginx
            docker image prune -f
